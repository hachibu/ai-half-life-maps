name: codex-worker

# Runs Codex unattended on the same loop as every agent: ask `tools.pipeline.next` for ONE action, let Codex
# do it inside the checkout, then publish the result deterministically (branch + PR, review comment, or new
# task issues). Needs two repo secrets, set by Codex's human:
#   OPENAI_API_KEY   pays for the Codex run (API billing)
#   AGENT_GH_TOKEN   a fine-grained token (contents + pull requests + issues: write) so Codex's pushes and PRs
#                    trigger CI like any person's would (pushes made with the default token do not)
# Without both secrets the job exits immediately. Codex's automatic PR reviews (Codex settings) need neither.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-worker
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_SECRETS: ${{ secrets.OPENAI_API_KEY != '' && secrets.AGENT_GH_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      - name: Secrets present?
        run: '[ "$HAS_SECRETS" = "true" ] || echo "codex-worker: OPENAI_API_KEY / AGENT_GH_TOKEN not set; skipping"'
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: env.HAS_SECRETS == 'true'
        run: pip install -r requirements.txt
      - name: Next action
        id: next
        if: env.HAS_SECRETS == 'true'
        run: |
          python -m tools.pipeline.next codex --json > next.json
          cat next.json
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re
          d = json.load(open("next.json"))
          a = d["action"]; n = d.get("issue") or d.get("pr") or 0
          slug = re.sub(r"[^a-z0-9]+", "-", (d.get("title") or a).lower()).strip("-")[:40]
          print("action=%s" % a); print("number=%s" % n)
          print("branch=%s" % (d.get("branch") or "codex/%s-%s" % (n, slug)))
          EOF
      - name: Prepare workspace
        if: env.HAS_SECRETS == 'true' && steps.next.outputs.action != 'idle'
        env:
          ACTION: ${{ steps.next.outputs.action }}
          N: ${{ steps.next.outputs.number }}
          BRANCH: ${{ steps.next.outputs.branch }}
        run: |
          git config user.name "codex-agent"; git config user.email "codex-agent@users.noreply.github.com"
          mkdir -p .codex-out
          case "$ACTION" in
            claim|fix-incident)
              gh api "repos/$GITHUB_REPOSITORY/issues/$N/labels" -f "labels[]=claimed:codex" > /dev/null
              git checkout -b "$BRANCH" ;;
            continue)
              if git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null; then git checkout "$BRANCH"; else git checkout -b "$BRANCH"; fi ;;
            fix-pr|review)
              git fetch -q origin "pull/$N/head:pr-$N" && git checkout "pr-$N" ;;
          esac
          { cat .github/codex/worker.md; echo; echo '## Your action (from tools.pipeline.next)'; echo '```json'; cat next.json; echo '```'
            for f in $(python -c "import json;print(' '.join(json.load(open('next.json'))['lessons']))"); do echo; echo "## Lesson: $f"; cat "$f"; done
          } > .codex-out/prompt.md
      - name: Run Codex
        if: env.HAS_SECRETS == 'true' && steps.next.outputs.action != 'idle'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-out/prompt.md
          output-file: .codex-out/final.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
      - name: Publish result
        if: env.HAS_SECRETS == 'true' && steps.next.outputs.action != 'idle'
        env:
          ACTION: ${{ steps.next.outputs.action }}
          N: ${{ steps.next.outputs.number }}
          BRANCH: ${{ steps.next.outputs.branch }}
        run: python -m tools.pipeline.publish codex "$ACTION" "$N" "$BRANCH"
