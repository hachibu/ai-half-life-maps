name: release

# On every merge to main (the pipeline dispatches this after it merges): build and test every map, publish the
# playable zips as a GitHub release, store screenshots as the "before" images for pull requests, and run the
# health gate: green -> new quality baseline in the ledger; red -> an `incident` issue every agent works first.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      maps: ${{ steps.list.outputs.maps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "maps=$(ls -d maps/*/ | xargs -n1 basename | grep -v '^_' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        map: ${{ fromJSON(needs.plan.outputs.maps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache SDHLT (the map compiler, built from tools/bsp/sdhlt.rev)
        uses: actions/cache@v4
        with:
          path: build/sdhlt
          key: sdhlt-${{ runner.os }}-${{ hashFiles('tools/bsp/sdhlt.rev') }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - run: make build MAP=${{ matrix.map }}
      - run: make test MAP=${{ matrix.map }}
      - name: Quality
        env:
          SATISFACTION_SEED: ${{ secrets.SATISFACTION_SEED }}
          HOLDOUT_KEY: ${{ secrets.HOLDOUT_KEY }}
        run: make quality MAP=${{ matrix.map }}
      - run: make views MAP=${{ matrix.map }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.map }}
          path: |
            build/${{ matrix.map }}/${{ matrix.map }}.zip
            build/${{ matrix.map }}/previews/
            build/${{ matrix.map }}/quality.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish          # one publish at a time, so two releases never pick the same tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag: v2026.11.26 for the day's first release, then v2026.11.26.2, .3 ...
          DAY="v$(date -u +%Y.%m.%d)"
          N=$(git ls-remote --tags origin "refs/tags/$DAY" "refs/tags/$DAY.*" | wc -l)
          TAG="$DAY"; [ "$N" -gt 0 ] && TAG="$DAY.$((N + 1))"
          # Title: "Nov 26, 2026 · <the merged change>"
          SUBJECT=$(git log -1 --format=%s)
          TITLE="$(date -u '+%b %-d, %Y') · $SUBJECT"
          echo "release $TAG: $TITLE"
          gh release create "$TAG" dist/*/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TITLE" --generate-notes

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - name: Build the CI helpers (tools/ci/ci)
        run: go build -o build/bin/ci ./tools/ci/ci
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Store main's screenshots on the previews branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin previews:previews; then git worktree add pv previews; else git worktree add --orphan -b previews pv; fi
          build/bin/ci previews store artifacts pv main
          cd pv && git add -A
          git diff --cached --quiet || git commit -qm "Screenshots of main at ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5; do git push origin HEAD:previews && break; sleep $((i * 3)); git pull --rebase -q origin previews; done

  health:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - name: Build the CI helpers (tools/ci/ci)
        run: go build -o build/bin/ci ./tools/ci/ci
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Open ledger
        run: bash tools/ci/ledger_open.sh
      - name: Healthy -> new quality baseline
        if: needs.build.result == 'success'
        run: |
          build/bin/ci quality baseline artifacts ledger-wt/scores/main.json
          python -c "from tools.pipeline import ledger; ledger.record('health', 'main', '-', True, '${{ github.sha }}', {})"
      - name: Broken -> incident
        if: needs.build.result != 'success'
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          OPEN=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=incident" --jq 'length')
          if [ "$OPEN" = "0" ]; then
            printf '%s\n' "main failed its build/test after a merge (${GITHUB_SHA::7}). Every agent works on this first." "" \
              "### Map" "none" "" "### Paths" "maps/" "tools/" "" "### Goal" "Make main build and pass every check again: $RUN" "" \
              "### Acceptance criteria" "- the release workflow on main is green" "- a lesson in docs/lessons/ explains what broke and the rule that prevents it" "" \
              "### Depends on" "None" "" "### Priority" "P0" > body.md
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="Incident: main is broken at ${GITHUB_SHA::7}" -F body=@body.md \
              -f "labels[]=incident" -f "labels[]=task" -f "labels[]=ready" > /dev/null
          fi
          python -c "from tools.pipeline import ledger; ledger.record('health', 'main', '-', False, '${{ github.sha }}', {'run': '$RUN'})"
      - name: Save ledger
        if: always()
        run: bash tools/ci/ledger_save.sh "health ${GITHUB_SHA::7}"
