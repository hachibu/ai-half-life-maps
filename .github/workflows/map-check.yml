name: map-check

# On every pull request: lint, build only the maps it touches (every map if shared tooling changed) at full
# quality, run every map check, post before/after screenshots and apply the visual gate. The final `map-check`
# job is the check branch rules require; automerge.yml merges agent PRs when this workflow succeeds.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: map-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # push screenshots to the `previews` branch
  pull-requests: write     # post the screenshot comment

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      maps: ${{ steps.pick.outputs.maps }}
      direct: ${{ steps.pick.outputs.direct }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - name: READMEs and the AGENTS.md lessons index up to date; lessons well-formed
        run: go run ./tools/cmd/ci readme --check && go run ./tools/cmd/ci lessons --check
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Go lint (golangci-lint; config in tools/.golangci.yml)
        run: make lint
      - id: pick
        name: Pick maps to build
        run: |
          ALL=$(ls -d maps/*/ | xargs -n1 basename | jq -R . | jq -cs .)
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "maps=$ALL" >> "$GITHUB_OUTPUT"; exit 0; fi
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          MAPCHANGED=$(echo "$CHANGED" | grep -vE '^maps/[^/]+/(README\.md|map\.toml|video/.*)$' || true)   # docs, metadata and video scripts don't change a map
          echo "$CHANGED"
          exists() { while read -r m; do [ -n "$m" ] && [ -d "maps/$m" ] && echo "$m"; done; }   # deleted maps aren't built
          # Maps whose own files changed. A change that leaves the generated map byte-identical (a refactor, a
          # comment) is no change: CI generates the map from both this PR and main and drops it if they match, so
          # it needs no new screenshot and isn't compiled.
          git worktree add -q /tmp/base "origin/${{ github.base_ref }}"
          BUILD=""; DIRECT=""
          for m in $(echo "$MAPCHANGED" | grep -oE '^maps/[^/]+/' | cut -d/ -f2 | sort -u | exists); do
            if [ -d "/tmp/base/maps/$m" ] && go run "./maps/$m" > /dev/null && (cd /tmp/base && go run "./maps/$m" > /dev/null) \
               && diff -rq "build/$m" "/tmp/base/build/$m" > /dev/null; then
              echo "$m: generated map is identical to main's, so nothing to show or build"
            else
              BUILD="$BUILD $m"
              case "$m" in _*) ;; *) DIRECT="$DIRECT $m" ;; esac   # the visual gate skips _template
            fi
          done
          echo "direct=$DIRECT" >> "$GITHUB_OUTPUT"
          # Rebuild every map only when something that builds or checks maps changed. Docs, the pipeline,
          # the README generator and the other workflows can't change a map, so they build nothing.
          # (main is still rebuilt in full by the release workflow after every merge.)
          if echo "$CHANGED" | grep -qE '^(go\.mod$|tools/|Makefile$|\.github/workflows/map-check\.yml$)'; then
            echo "maps=$ALL" >> "$GITHUB_OUTPUT"
          else
            M=$(for m in $BUILD; do echo "$m"; done | jq -R . | jq -cs '[.[] | select(length > 0)]')
            echo "maps=$M" >> "$GITHUB_OUTPUT"
          fi

  placeholder:
    # Post a "rendering" placeholder in the screenshot comment as soon as CI starts; the screenshots job below
    # finds the same comment (by its marker) and replaces it with the before/after shots.
    needs: plan
    if: needs.plan.outputs.maps != '[]' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.event.pull_request.number }}
      MAPS: ${{ needs.plan.outputs.maps }}
    steps:
      - name: Post or update the screenshot comment with a placeholder
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          LIST=$(echo "$MAPS" | jq -r 'map("`" + . + "`") | join(", ")')
          printf '%s\n' '<!-- map-previews -->' '## Screenshots' '' \
            "⏳ **Rendering previews…** CI is compiling $LIST with full VIS and full lighting, then rendering every view." \
            "This comment is replaced with before/after screenshots when that finishes (usually a few minutes; [run]($RUN))." \
            > comment.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" --paginate \
               --jq '.[] | select(.body | startswith("<!-- map-previews -->")) | .id' | head -1)
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@comment.md >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" -F body=@comment.md >/dev/null; fi

  build:
    needs: plan
    if: needs.plan.outputs.maps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        map: ${{ fromJSON(needs.plan.outputs.maps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - name: Cache SDHLT (the map compiler, built from tools/sdhlt.rev)
        uses: actions/cache@v4
        with:
          path: build/sdhlt
          key: sdhlt-${{ runner.os }}-${{ hashFiles('tools/sdhlt.rev') }}
      - name: Build ${{ matrix.map }}
        run: make build MAP=${{ matrix.map }}
      - name: Test ${{ matrix.map }}
        run: make test MAP=${{ matrix.map }}
      - name: Previews
        if: always()
        run: make views MAP=${{ matrix.map }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.map }}
          path: |
            build/${{ matrix.map }}/${{ matrix.map }}.zip
            build/${{ matrix.map }}/previews/
          if-no-files-found: ignore

  screenshots:
    needs: [plan, build]
    # same-repo branches only (forks get a read-only token)
    if: always() && needs.build.result != 'skipped' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PREFIX: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.mod
      - name: Build the CI helpers (tools/cmd/ci)
        run: go build -o build/bin/ci ./tools/cmd/ci
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Push screenshots to the previews branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin previews:previews; then git worktree add pv previews; else git worktree add --orphan -b previews pv; fi
          build/bin/ci previews store artifacts pv "$PREFIX"
          cd pv && git add -A
          git diff --cached --quiet || git commit -qm "Screenshots for #${{ github.event.pull_request.number }}"
          for i in 1 2 3 4 5; do git push origin HEAD:previews && break; sleep $((i * 3)); git pull --rebase -q origin previews; done
          echo "REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Post or update the screenshot comment
        run: |
          build/bin/ci previews comment pv "$PREFIX" "$GITHUB_REPOSITORY" "$REF" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > comment.md
          N=${{ github.event.pull_request.number }}
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" --paginate \
               --jq '.[] | select(.body | startswith("<!-- map-previews -->")) | .id' | head -1)
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@comment.md >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" -F body=@comment.md >/dev/null; fi
      - name: Visual gate
        run: build/bin/ci previews gate pv "$PREFIX" "${{ needs.plan.outputs.direct }}"

  map-check:
    # The one check branch rules require: every job above passed or was skipped (map builds skip when no map
    # changed). automerge.yml merges agent PRs when this workflow succeeds.
    name: map-check
    needs: [plan, placeholder, build, screenshots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
