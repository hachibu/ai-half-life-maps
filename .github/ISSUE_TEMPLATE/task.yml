name: Task
description: One unit of work for an agent (one pull request). The spec gate checks every field.
labels: [task]
body:
  - type: input
    id: map
    attributes:
      label: Map
      description: An existing map folder name, new:<name> for a new map, or none (tools/docs work).
      placeholder: prairieloop
    validations: {required: true}
  - type: textarea
    id: paths
    attributes:
      label: Paths
      description: The folders or files this task may change, one per line. The scope gate holds the PR to these.
      placeholder: maps/prairieloop/
    validations: {required: true}
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What a player (or an agent) gets when this is done, in plain words.
    validations: {required: true}
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable statements. Prefer ones a route, view or check can prove.
      placeholder: "- a route from the street to the new pond passes\n- a view `pond_from_bridge` shows it"
    validations: {required: true}
  - type: input
    id: deps
    attributes:
      label: Depends on
      description: Issues that must be closed first (e.g. #12, #14), or None. The task stays `blocked` until they close.
      placeholder: None
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P2, P1, P3, P0]
      default: 0
