# golangci-lint v2 config for all Go code in the repo (one go.mod at the root). It lives under tools/ because
# task Paths must stay inside the repo areas; `make lint` passes it with -c from the repo root. CI pins the
# same golangci-lint version in .github/workflows/map-check.yml.
#
# Output is pinned by `make golden`, so a lint fix must never change a compiled BSP or a score: run
# `make golden` after fixing anything that builds the template map.
version: "2"

linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # bugs
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - nilerr
    - unconvert
    - unparam
    # style and clarity
    - dupl
    - gocritic
    - goconst
    - misspell
    - nakedret
    - revive
    # modern Go and tidiness (round two)
    - errname
    - err113
    - exhaustive
    - forcetypeassert
    - godot
    - intrange
    - makezero
    - mirror
    - modernize
    - nolintlint
    - perfsprint
    - predeclared
    - usestdlibvars
    - wastedassign
    - whitespace
    # complexity ceiling: limits sit at today's worst function, so nothing may get worse (see settings)
    - cyclop
    - funlen
    - gocognit
    - nestif
  # prealloc is left out on purpose: a micro-optimisation hint whose suggested capacities are wrong for the
  # variable-length appends this code does (points per brush).
  settings:
    # Complexity ceiling. Each limit equals today's worst function, so no function may grow past it. Lower
    # a limit when you split the function that sets it (worst now in brackets), and never raise one.
    gocognit:
      min-complexity: 130       # how hard a function is to follow (finalizeLighting 130, BSP.check 89, bspc main 67)
    cyclop:
      max-complexity: 57        # branch paths (finalizeLighting 57, BSP.check 52, Parse 36)
    nestif:
      min-complexity: 9         # nested ifs; flags 9 and up (the limit sat at the old scorer's worst; lower it when convenient)
    funlen:
      lines: -1                 # statement count is the meaningful size measure
      statements: 93            # (renderer drawFace 93, renderer New 73, renderer Frame 63)
      ignore-comments: true
    gosec:
      excludes:
        - G304   # file path from a variable: these are command-line tools that read the files they're given
        - G703   # path traversal via taint analysis: the same thing, seen through the command-line arguments
        - G306   # WriteFile with 0644: build outputs are meant to be readable

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
  relative-path-mode: gomod     # report paths from the repo root (where go.mod is), not from tools/
