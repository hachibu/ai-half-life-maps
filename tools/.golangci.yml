# golangci-lint v2 config for all Go code in the repo (one go.mod at the root). It lives under tools/ because
# task Paths must stay inside the repo areas; `make lint` passes it with -c from the repo root. CI pins the
# same golangci-lint version in .github/workflows/map-check.yml.
# Standard linters: errcheck, govet, ineffassign, staticcheck, unused. Formatter: gofmt.
version: "2"

linters:
  default: standard

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
  relative-path-mode: gomod     # report paths from the repo root (where go.mod is), not from tools/
